spring.application.name=WeekendKanban

spring.datasource.url=jdbc:h2:mem:kanban
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# ?????????????????????????????????????????????????????????????
# Wicket: Development Mode
#   DEVELOPMENT ? detaillierte Fehlermeldungen, kein HTML-Cache,
#                 MarkupParser liest Templates bei jedem Request
#   DEPLOYMENT  ? für Production (minified, gecacht)
# ?????????????????????????????????????????????????????????????
wicket.configuration=development

# ?????????????????????????????????????????????????????????????
# Spring Boot DevTools ? Feinabstimmung
#   restart.poll-interval: wie oft der Classpath-Watcher prüft (ms)
#   restart.quiet-period:  Wartezeit nach letzter Änderung vor Restart
# ?????????????????????????????????????????????????????????????
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

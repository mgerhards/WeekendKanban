<wicket:panel>
<div class="card">
    <div class="card-body p-2">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div class="flex-grow-1">
          <div wicket:id="viewContainer">
            <div class="fw-semibold" wicket:id="title"></div>
            <div class="small text-secondary" wicket:id="description"></div>
            <div class="small text-secondary" wicket:id="assignee"></div>
          </div>
          <div class="btn-group btn-group-sm">
            <a class="btn btn-outline-secondary" wicket:id="moveLeft">←</a>
            <a class="btn btn-outline-secondary" wicket:id="moveRight">→</a>
            <a class="btn btn-outline-danger" wicket:id="delete">✕</a>
          </div>
      </div>
      <div wicket:id="editContainer" class="mt-3" style="display: none;">
        <form wicket:id="editForm" class="mt-2">
          <div class="mb-2">
            <input wicket:id="editTitle" type="text" class="form-control form-control-sm" placeholder="Task title"/>
          </div>
          <div class="mb-2">
            <textarea wicket:id="editDescription" class="form-control form-control-sm" placeholder="Task description"></textarea>
          </div>
          <div class="mb-2">
            <input wicket:id="editAssignee" type="text" class="form-control form-control-sm" placeholder="Assignee"/>
          </div>
          <button wicket:id="saveChanges" type="submit" class="btn btn-primary btn-sm">Save</button>
          <button wicket:id="cancelEdit" type="button" class="btn btn-secondary btn-sm">Cancel</button>
        </form>
      </div>
    </div>
  </div>
</div>
</wicket:panel>

<wicket:panel>
    <div class="panel p-3">
        <table class="table table-bordered table-hover text-center">
            <thead class="table-dark">
                <tr>
                    <th>Open Tasks</th>
                    <th>Closed Tasks</th>
                    <th>All Tasks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="text-dark" wicket:id="count_open">0</span></td>
                    <td><span class="" wicket:id="count_closed">0</span></td>
                    <td><span class="" wicket:id="count_all">0</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</wicket:panel>
